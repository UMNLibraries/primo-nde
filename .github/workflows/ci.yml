name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    permissions:
      actions: read
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      # Cache node_modules
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Derive SHA values for nx affected commands
        if: ${{ !env.ACT }}
        uses: nrwl/nx-set-shas@v4

      - name: Set Fallback SHAs for local act testing
        if: ${{ env.ACT }}
        run: |
          echo "NX_BASE=HEAD~1" >> $GITHUB_ENV
          echo "NX_HEAD=HEAD" >> $GITHUB_ENV

      - name: Lint
        run: npx nx affected -t lint

      - name: Test
        run: npx nx affected -t test

      - name: Build
        run: npx nx affected -t build

      - name: Create affected view packages (PR)
        if: github.event_name == 'pull_request'
        run: npx nx affected --target=package --projects=tag:app-view --configuration=production

      - name: Create affected view packages (Main merge)
        if: github.event_name == 'push'
        run: npx nx run-many --target=package --projects=tag:app-view --configuration=production

      - name: Upload view packages
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: primo-view-zips-${{ github.sha }}
          path: dist/packages/**/*.zip
          retention-days: 7
          if-no-files-found: ignore
