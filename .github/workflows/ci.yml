name: CI

on:
  push:
    branches:
      - main
  workflow_call:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest

    permissions:
      actions: write
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          filter: tree:0
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore/Save Nx Local Cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-

      - name: Derive SHA values for nx affected commands
        if: ${{ !env.ACT }}
        uses: nrwl/nx-set-shas@v4

      - name: Set Fallback SHAs for local act testing
        if: ${{ env.ACT }}
        run: |
          echo "NX_BASE=HEAD~1" >> $GITHUB_ENV
          echo "NX_HEAD=HEAD" >> $GITHUB_ENV

      - name: Lint Affected
        run: npx nx affected -t lint

      - name: Test Affected
        run: npx nx affected -t test

      - name: Build Affected
        run: npx nx affected -t build

      - name: Create Affected View Packages
        run: npx nx affected --t package --configuration=production

      - name: Upload view packages
        if: ${{ !env.ACT }}
        uses: actions/upload-artifact@v4
        with:
          name: primo-view-packages-${{ github.sha }}
          path: dist/packages/**/*.zip
          retention-days: 7
          if-no-files-found: ignore
