name: Deploy Addon Previews

on:
  pull_request:
    types: [opened, synchronize, reopened]

concurrency:
  group: preview-addons-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  deploy-previews:
    needs: ci
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore Nx Local Cache
        uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-

      - name: Derive SHA values for nx affected
        uses: nrwl/nx-set-shas@v4

      - name: Get Affected Addon Names
        id: affected
        run: |
          PROJECTS=$(npx nx show projects --affected --projects="apps/addons/*" --json)
          echo "projects=$PROJECTS" >> $GITHUB_OUTPUT

      - name: Deploy Affected Addon Previews
        if: ${{ steps.affected.outputs.projects != '[]' && steps.affected.outputs.projects != '' }}
        run: |
          npx nx affected --target=deploy --projects="apps/addons/*" -- --branch="${{ github.head_ref }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment Preview URLs on PR
        if: ${{ github.event.action == 'opened' && steps.affected.outputs.projects != '[]' && steps.affected.outputs.projects != '' }}
        uses: actions/github-script@v7
        with:
          script: |
            const rawProjects = `${{ steps.affected.outputs.projects }}`;
            const projects = JSON.parse(rawProjects);
            const rawBranch = '${{ github.head_ref }}';

            if (!projects || projects.length === 0) return;

            const normalizedBranch = rawBranch
              .toLowerCase()
              .replace(/[^a-z0-9-]/g, '-')
              .replace(/-+/g, '-')
              .replace(/^-|-$/g, '');

            const urls = projects.map(name => {
              const cloudflareProjectName = `primo-nde-${name}`;
              const url = `https://${normalizedBranch}.${cloudflareProjectName}.pages.dev`;
              return `* **${name}**: [${url}](${url})`;
            });

            const body = `### 🚀 Affected Add-on Previews\n\n` + urls.join('\n');

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });
