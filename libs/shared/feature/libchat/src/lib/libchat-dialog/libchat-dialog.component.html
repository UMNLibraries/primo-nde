<mat-dialog-content class="chat-content">
  <iframe
    [src]="url"
    title="Chat with a librarian"
    frameborder="0"
    width="100%"
    height="100%"
  ></iframe>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-raised-button mat-dialog-close>Close chat</button>
</mat-dialog-actions>
