<mat-dialog-content class="chat-content">
  <div class="chat-header">
    <button
      mat-icon-button
      mat-dialog-close
      aria-label="Close chat"
      matTooltip="Close chat"
    >
      <mat-icon>close</mat-icon>
    </button>
  </div>
  <iframe
    [src]="url"
    title="Chat with a librarian"
    frameborder="0"
    width="100%"
    height="100%"
  ></iframe>
</mat-dialog-content>
